# Datasource
quarkus.datasource.db-kind=postgresql
# %prod: im Docker-Compose-Netzwerk gegen den echten Postgres-Container.
# %dev/%test: keine feste jdbc.url -> Quarkus Dev Services startet automatisch einen
# Wegwerf-Postgres-Container, damit Tests nicht die echte Datenbank anfassen.
%prod.quarkus.datasource.username=postgres
%prod.quarkus.datasource.password=postgres
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/postgres

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Optional: SQL beim Start ausführen (z.B. import.sql)
#quarkus.hibernate-orm.sql-load-script=import.sql

# HTTP
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Kafka
# %dev/%test: kein bootstrap.servers -> Quarkus Dev Services startet automatisch einen Wegwerf-Broker.
%prod.kafka.bootstrap.servers=kafka:9092

mp.messaging.outgoing.kafkatest-out.connector=smallrye-kafka
mp.messaging.outgoing.kafkatest-out.topic=kafkatest
mp.messaging.outgoing.kafkatest-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer