global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'quarkus-app'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['quarkus-app:8080']
      
  - job_name: 'apisix'
    metrics_path: '/apisix/prometheus/metrics'
    static_configs:
      - targets: ['apisix:9091']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
      
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'quarkus-book-crud'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['quarkus-book-crud:8080']

  - job_name: 'quarkus-author-crud'
    metrics_path: '/q/metrics'
    static_configs:
      - targets: ['quarkus-author-crud:8080']
