apisix:
  node_listen: 9080
  enable_admin: true
deployment:
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f
        role: admin
    enable_admin_ui: true
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
plugin_attr:
  prometheus:
    export_uri: /apisix/prometheus/metrics
    export_addr:
      ip: 0.0.0.0
      port: 9091
    enable_export_server: true
