quarkus.http.port=8080
quarkus.http.host=0.0.0.0

quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.jdbc.url=jdbc:sqlite:/deployments/data/author.db
quarkus.datasource.jdbc.min-size=1
quarkus.datasource.jdbc.max-size=1
# SQLite läuft unter db-kind=other -> weder ExceptionSorter noch Dev Services werden unterstützt.
# jdbc.url ist in jedem Profil explizit gesetzt, Dev Services wird also nie gebraucht.
quarkus.datasource.devservices.enabled=false
quarkus.log.category."io.quarkus.agroal.runtime.AgroalConnectionConfigurer".level=ERROR

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.schema-management.strategy=update

%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:target/author-dev.db
%test.quarkus.datasource.jdbc.url=jdbc:sqlite:target/author-test.db
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
