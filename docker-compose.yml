services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
      
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    command:
      - '--collector.stat_statements'
    depends_on:
      - postgres
    networks:
      - backend
      
  quarkus-app:
    image: quarkus1
    container_name: quarkus_app
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - backend
    # kein "ports:" nötig – nur intern über APISIX erreichbar

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - apisix
    networks:
      - backend

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: apisix_etcd
    restart: unless-stopped
    command:
      - etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd_data:/etcd-data
    networks:
      - backend

  apisix:
    image: apache/apisix:3.9.1-debian
    container_name: apisix
    restart: unless-stopped
    depends_on:
      - etcd
      - quarkus-app
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    networks:
      - backend
    ports:
      - "9080:9080"
      - "9180:9180"
      
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - backend
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:8080/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - backend
  
  ubuntu:
    image: ubuntu
    container_name: ubuntu_experiments
    restart: unless-stopped
    tty: true
    stdin_open: true
    networks:
      - backend
    command: bash -c "apt update && apt install -y curl && tail -f /dev/null"
      
volumes:
  postgres_data:
  etcd_data:
  prometheus_data:
  grafana_data:

networks:
  backend:
    driver: bridge
